<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — PAU Housing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"/>
  <script src="../js/accessibility.js"></script>
  <script src="../js/config.js"></script>
  <style>
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 44px;
    }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--pau-gray);
      padding: 4px;
      line-height: 1;
    }
    .eye-btn:hover { color: var(--pau-blue); }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-image-panel">
      <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=900&q=80" alt="House"/>
      <div class="auth-image-overlay">
        <a href="../../index.html" class="auth-back">&#8592; Back to Home</a>
        <div class="auth-image-text">
          <h2>Welcome Back</h2>
          <p>Sign in to browse verified housing listings and connect with landlords near PAU campus.</p>
        </div>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-card">
        <div class="auth-logo">
          <span>🏛</span>
          <p>PAU Housing System</p>
        </div>

        <div class="role-tabs">
          <button class="role-tab active" id="tabStudent" onclick="switchRole('student')">
            🎓 Student Login
          </button>
          <button class="role-tab" id="tabLandlord" onclick="switchRole('landlord')">
            🏠 Owner Login
          </button>
          <button class="role-tab" id="tabAgent" onclick="switchRole('agent')">
            🧭 Agent Login
          </button>
        </div>

        <div id="roleLabel" class="role-label">Signing in as a <strong>Student</strong></div>

        <div id="errorMsg"   class="auth-error"   style="display:none;"></div>
        <div id="successMsg" class="auth-success" style="display:none;"></div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="Enter your email address"/>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Enter your password"/>
            <button class="eye-btn" type="button" onclick="togglePassword('password', 'eyeIcon1')"
              title="Show/hide password" aria-label="Show password">
              <span id="eyeIcon1" class="eye-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M12 5c-7.5 0-11 6.7-11 7s3.5 7 11 7 11-6.7 11-7-3.5-7-11-7zm0 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8.5c-1.9 0-3.5 1.6-3.5 3.5S10.1 15.5 12 15.5 15.5 13.9 15.5 12 13.9 8.5 12 8.5z"/>
                  <circle cx="12" cy="12" r="2"/>
                </svg>
              </span>
            </button>
          </div>
        </div>

        <div class="form-row-between">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"/> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button class="btn-auth" onclick="handleLogin()">Sign In</button>

        <p class="auth-switch">
          Don't have an account? <a href="register.html">Sign up here</a>
        </p>

        <div class="auth-demo-info">
          <p style="font-size:12px;color:var(--pau-gray);text-align:center;margin-top:16px;">
            Demo: student@pau.edu.ng / student123
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LOCAL_ACCOUNTS = [
      { id:1, name:'Test Student',  email:'student@pau.edu.ng',  password:'student123',  role:'student'  },
      { id:2, name:'Test Landlord', email:'landlord@pau.edu.ng', password:'landlord123', role:'landlord' },
    ];

    function switchRole(role) {
      document.getElementById('tabStudent').classList.toggle('active', role === 'student');
      document.getElementById('tabLandlord').classList.toggle('active', role === 'landlord');
      document.getElementById('tabAgent').classList.toggle('active', role === 'agent');
      document.getElementById('roleLabel').innerHTML =
        role === 'student'
          ? 'Signing in as a <strong>Student</strong>'
          : role === 'agent'
            ? 'Signing in as an <strong>Agent</strong>'
            : 'Signing in as a <strong>Property Owner</strong>';
      document.querySelector('.auth-switch a').href = `register.html?role=${role}`;
    }

    const EYE_OPEN_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 5c-7.5 0-11 6.7-11 7s3.5 7 11 7 11-6.7 11-7-3.5-7-11-7zm0 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8.5c-1.9 0-3.5 1.6-3.5 3.5S10.1 15.5 12 15.5 15.5 13.9 15.5 12 13.9 8.5 12 8.5z"/><circle cx="12" cy="12" r="2"/></svg>';
    const EYE_CLOSED_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M1.39 4.22l1.41-1.41 17 17-1.41 1.41-1.9-1.9C14.55 21.3 13.29 21.8 12 21.8c-7.5 0-11-6.7-11-7 0-.78.22-1.53.64-2.17L1.39 4.22zm8.44 8.44l-1.75-1.75C7.08 10.78 7 11.38 7 12c0 2.8 2.2 5 5 5 .62 0 1.22-.07 1.77-.19l-1.94-1.94c-.18.02-.37.03-.56.03-1.93 0-3.5-1.57-3.5-3.5 0-.19.01-.38.03-.56zm11.17 2.39C21.78 13.53 22 12.78 22 12c0-7.5-3.5-7-11-7-1.29 0-2.55.5-3.55 1.31l1.47 1.47C10.78 6.08 11.38 6 12 6c2.8 0 5 2.2 5 5 0 .62-.07 1.22-.19 1.77l1.77 1.77zM12 8.5c-1.93 0-3.5 1.57-3.5 3.5 0 .62.17 1.2.47 1.7l4.73 4.73c.5.3 1.08.47 1.7.47 1.93 0 3.5-1.57 3.5-3.5 0-.62-.17-1.2-.47-1.7L12 8.5z"/></svg>';

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const btn   = icon.closest('button');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = EYE_CLOSED_ICON;
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        icon.innerHTML = EYE_OPEN_ICON;
        btn.setAttribute('aria-label', 'Show password');
      }
    }

    function personalizeLoginPage() {
      const currentUser = JSON.parse(localStorage.getItem('pau_user') || 'null');
      if (!currentUser || !currentUser.name) return;
      const firstName = currentUser.name.split(' ')[0];
      const heading = document.querySelector('.auth-image-text h2');
      const subtitle = document.querySelector('.auth-image-text p');
      const switchText = document.querySelector('.auth-switch');
      const button = document.querySelector('.btn-auth');
      if (heading) heading.textContent = `Welcome back, ${firstName}!`;
      if (subtitle) subtitle.textContent = 'You are already signed in. Return to the homepage or logout to switch accounts.';
      if (switchText) switchText.innerHTML = 'Already logged in? <a href="../../index.html">Go Home</a>';
      if (button) button.textContent = 'Go Home';
    }

    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl    = document.getElementById('errorMsg');
      const succEl   = document.getElementById('successMsg');

      errEl.style.display = succEl.style.display = 'none';

      if (!email || !password) {
        errEl.style.display = 'block';
        errEl.textContent   = 'Please enter your email and password.';
        return;
      }

      const btn = document.querySelector('.btn-auth');
      btn.textContent = 'Signing in...';
      btn.disabled    = true;

      try {
        const res  = await fetch(`${API_BASE}/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('pau_token', data.token);
          localStorage.setItem('pau_user',  JSON.stringify(data.user));
          succEl.style.display = 'block';
          succEl.textContent   = `✅ Welcome back, ${data.user.name.split(' ')[0]}! Redirecting...`;
          
          setTimeout(() => {
            if (data.user.role === 'landlord') {
              window.location.href = 'owner-dashboard.html';
            } else {
              window.location.href = '../../index.html';
            }
          }, 1500);
        } else {
          errEl.style.display = 'block';
          errEl.textContent   = data.error || 'Invalid email or password.';
          btn.textContent = 'Sign In';
          btn.disabled    = false;
        }
      } catch {
        // Fallback for local accounts when server connection fails
        const savedAccounts = JSON.parse(localStorage.getItem('pau_accounts') || '[]');
        const accounts = [...LOCAL_ACCOUNTS, ...savedAccounts];
        const found = accounts.find(a => a.email === email && a.password === password);
        
        if (found) {
          localStorage.setItem('pau_token', `local-${Date.now()}`);
          localStorage.setItem('pau_user', JSON.stringify(found));
          succEl.style.display = 'block';
          succEl.textContent   = `✅ Welcome back, ${found.name.split(' ')[0]}! Redirecting...`;
          
          setTimeout(() => {
            if (found.role === 'landlord') {
              window.location.href = 'owner-dashboard.html';
            } else {
              window.location.href = '../../index.html';
            }
          }, 1200);
          return;
        }
        errEl.style.display = 'block';
        errEl.textContent   = 'Cannot connect to server. Please try again.';
        btn.textContent = 'Sign In';
        btn.disabled    = false;
      }
    }

    // Allow Enter key to submit inside the form
    document.querySelectorAll('#email, #password').forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
      });
    });

    personalizeLoginPage();
  </script>
</body>
</html>
