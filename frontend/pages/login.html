<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — PAU Housing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* FULL PAGE BACKGROUND IMAGE */
    .bg-image {
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600&q=90');
      background-size: cover;
      background-position: center;
      filter: blur(6px) brightness(0.45);
      transform: scale(1.05);
      z-index: 0;
    }

    /* DARK OVERLAY */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 18, 60, 0.55);
      z-index: 1;
    }

    /* FORM CARD — sits on top */
    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      margin: 20px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo span { font-size: 40px; }

    .login-logo h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #001f5b;
      margin-top: 8px;
      font-weight: 700;
    }

    .login-logo p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* ROLE TABS */
    .role-tabs {
      display: flex;
      background: #f4f6fb;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 18px;
      gap: 4px;
    }

    .role-tab {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      color: #6b7280;
      transition: all 0.2s;
    }

    .role-tab.active {
      background: #003087;
      color: white;
      box-shadow: 0 2px 8px rgba(0,48,135,0.25);
    }

    .role-label {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 20px;
    }

    .role-label strong { color: #003087; }

    /* FORM */
    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4b5e8a;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .form-group input {
      width: 100%;
      border: 1.5px solid #d1d9e6;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: #1a2340;
      transition: all 0.2s;
      outline: none;
      background: #f9fafb;
    }

    .form-group input:focus {
      border-color: #003087;
      background: white;
      box-shadow: 0 0 0 3px rgba(0,48,135,0.10);
    }

    .form-row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 13px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #6b7280;
      cursor: pointer;
    }

    .forgot-link {
      color: #003087;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-auth {
      width: 100%;
      background: #003087;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-auth:hover { background: #0050c8; transform: translateY(-1px); }

    .auth-error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .auth-success {
      background: #d1fae5;
      color: #065f46;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .auth-switch {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6b7280;
    }

    .auth-switch a {
      color: #003087;
      font-weight: 600;
      text-decoration: none;
    }

    .back-home {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 20;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      background: rgba(255,255,255,0.15);
      padding: 8px 16px;
      border-radius: 100px;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .back-home:hover { background: rgba(255,255,255,0.28); }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; margin: 16px; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- Back to home -->
  <a href="index.html" class="back-home">&#8592; Back to Home</a>

  <!-- Login Card -->
  <div class="login-card">
    <div class="login-logo">
      <span>🏛</span>
      <h2>PAU Housing System</h2>
      <p>Pan-Atlantic University · Official Housing Portal</p>
    </div>

    <!-- Role tabs -->
    <div class="role-tabs">
      <button class="role-tab active" id="tabStudent" onclick="switchRole('student')">
        🎓 Student Login
      </button>
      <button class="role-tab" id="tabLandlord" onclick="switchRole('landlord')">
        🏠 Owner Login
      </button>
    </div>

    <div id="roleLabel" class="role-label">
      Signing in as a <strong>Student</strong>
    </div>
    <input type="hidden" id="userRole" value="student"/>

    <div id="errorMsg"   class="auth-error"   style="display:none;"></div>
    <div id="successMsg" class="auth-success" style="display:none;"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password"/>
    </div>

    <div class="form-row-between">
      <label class="checkbox-label">
        <input type="checkbox"/> Remember me
      </label>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <button class="btn-auth" id="loginBtn" onclick="handleLogin()">Sign In</button>

    <p class="auth-switch">
      Don't have an account?
      <a href="register.html" id="registerLink">Sign up here</a>
    </p>
  </div>

  <script>
    // =====================================================
    // LOCAL ACCOUNTS — works even without backend running
    // =====================================================
    const LOCAL_ACCOUNTS = [
      { id:1, name:'Test Student',  email:'student@pau.edu.ng',  password:'student123',  role:'student',  phone:'08000000001', landlord_id: null },
      { id:2, name:'Test Landlord', email:'landlord@pau.edu.ng', password:'landlord123', role:'landlord', phone:'08000000002', landlord_id: 1 },
    ];

    function switchRole(role) {
      document.getElementById('userRole').value = role;
      document.getElementById('tabStudent').classList.toggle('active', role === 'student');
      document.getElementById('tabLandlord').classList.toggle('active', role === 'landlord');
      document.getElementById('roleLabel').innerHTML =
        role === 'student'
          ? 'Signing in as a <strong>Student</strong>'
          : 'Signing in as a <strong>Property Owner</strong>';
      document.getElementById('registerLink').href =
        role === 'student' ? 'register.html?role=student' : 'register.html?role=landlord';
    }

    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg   = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const btn        = document.getElementById('loginBtn');

      errorMsg.style.display   = 'none';
      successMsg.style.display = 'none';

      if (!email || !password) {
        errorMsg.style.display = 'block';
        errorMsg.textContent   = 'Please enter both email and password.';
        return;
      }

      btn.textContent  = 'Signing in...';
      btn.disabled     = true;

      // ---- Try backend first ----
      try {
        const res  = await fetch('http://localhost:3000/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          loginSuccess(data.token, data.user);
          return;
        } else {
          // Backend running but credentials wrong
          errorMsg.style.display = 'block';
          errorMsg.textContent   = data.error || 'Invalid email or password.';
          btn.textContent = 'Sign In';
          btn.disabled    = false;
          return;
        }
      } catch {
        // Backend not running — fall through to local accounts
      }

      // ---- Fallback: local account check ----
      const found = LOCAL_ACCOUNTS.find(
        a => a.email === email && a.password === password
      );

      if (found) {
        const token = `local-token-${found.id}-${Date.now()}`;
        loginSuccess(token, found);
      } else {
        // Also check accounts saved from register
        const savedAccounts = JSON.parse(localStorage.getItem('pau_accounts') || '[]');
        const savedUser = savedAccounts.find(
          a => a.email === email && a.password === password
        );
        if (savedUser) {
          const token = `local-token-${savedUser.id}-${Date.now()}`;
          loginSuccess(token, savedUser);
        } else {
          errorMsg.style.display = 'block';
          errorMsg.textContent   = 'Invalid email or password.';
          btn.textContent = 'Sign In';
          btn.disabled    = false;
        }
      }
    }

    function loginSuccess(token, user) {
      localStorage.setItem('pau_token', token);
      localStorage.setItem('pau_user',  JSON.stringify(user));

      const successMsg = document.getElementById('successMsg');
      successMsg.style.display = 'block';
      successMsg.textContent   = `Welcome back, ${user.name.split(' ')[0]}! Redirecting...`;

      setTimeout(() => {
        window.location.href = user.role === 'landlord'
          ? 'owner-dashboard.html'
          : 'student-dashboard.html';
      }, 1000);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
