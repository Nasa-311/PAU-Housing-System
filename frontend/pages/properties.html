<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Properties — PAU Housing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <nav class="navbar solid" id="navbar">
    <div class="nav-brand">
      <img src="../images/logo2.png" alt="PAU Housing Logo" class="nav-logo-img" style="height: 80px; width: auto; vertical-align: middle; margin-right: 10px;">
      <span class="nav-title">PAU Housing</span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="../../index.html">Home</a></li>
      <li><a href="properties.html" class="active">Properties</a></li>
      <li><a href="landlords.html">Landlords</a></li>
      <li><a href="login.html" class="btn-nav">Login</a></li>
      <li><a href="register.html" class="btn-nav-outline">Sign Up</a></li>
    </ul>
    <button class="hamburger" id="hamburger">&#9776;</button>
  </nav>

  <div class="page-hero-mini" id="pageHero">
    <h1 id="pageTitle">Browse Properties</h1>
    <p id="pageSubtitle">Find verified off-campus housing near Pan-Atlantic University</p>
  </div>

  <div class="properties-page-layout">
    <aside class="filter-sidebar">
      <h3>Filter Listings</h3>
      <div class="filter-group">
        <label>Search by Name</label>
        <input type="text" id="filterName" placeholder="Property name..."/>
      </div>
      <div class="filter-group">
        <label>Room Type</label>
        <select id="filterType">
          <option value="">All Types</option>
          <option value="single">Single Room</option>
          <option value="shared">Shared Room</option>
          <option value="self-contain">Self Contain</option>
          <option value="flat">Flat</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Max Rent: <strong id="filterRentDisplay">&#8358;1,000,000</strong>/yr</label>
        <input type="range" id="filterRent" min="50000" max="1000000" step="10000" value="1000000"
          oninput="document.getElementById('filterRentDisplay').textContent='&#8358;'+Number(this.value).toLocaleString()"/>
      </div>
      <div class="filter-group">
        <label>Max Distance from PAU</label>
        <select id="filterDist">
          <option value="">Any Distance</option>
          <option value="0.5">Within 0.5km</option>
          <option value="1">Within 1km</option>
          <option value="2">Within 2km</option>
          <option value="3">Within 3km</option>
        </select>
      </div>
      <button class="btn-primary filter-btn" onclick="applyFilters()">Apply Filters</button>
      <button class="btn-outline  filter-btn" onclick="clearFilters()">Clear Filters</button>

      <div id="backToLandlord" style="display:none; margin-top:16px;">
        <a href="landlords.html" class="btn-outline"
          style="width:100%;text-align:center;display:block;">&#8592; All Landlords</a>
      </div>
    </aside>

    <div class="properties-results">
      <div class="results-header">
        <span id="resultsCount">Loading...</span>
        <select id="sortBy" onchange="applyFilters()">
          <option value="newest">Newest First</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="distance">Closest to PAU</option>
        </select>
      </div>
      <div class="properties-grid" id="propertiesGrid">
        <p class="loading-text">Loading properties...</p>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/accessibility.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // --- Environment Config Selection ---
    // Safely routes to localhost when testing locally, or your live production Render app
    const BASE_URL = typeof API_BASE_URL !== 'undefined' 
      ? API_BASE_URL 
      : (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
          ? 'http://localhost:3000' 
          : 'https://pau-housing-system.onrender.com'); // ✅ Points directly to your verified Render instance

    const TYPE_IMAGES = {
      'self-contain': ['../images/self-contained1.jpg','../images/self-contained2.jpg','../images/self-contained4.jpg'],
      'single':  ['https://images.unsplash.com/photo-1554995207-c18c203602cb?w=400&q=80','https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=400&q=80'],
      'shared':  ['https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=400&q=80','https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=400&q=80'],
      'flat':    ['https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=400&q=80','https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=400&q=80'],
    };
    const typeCounters = {};

    function getCardImage(roomType) {
      const type = (roomType||'').toLowerCase();
      let key = type.includes('self') ? 'self-contain'
               : type.includes('single') ? 'single'
               : type.includes('shared') ? 'shared'
               : type.includes('flat')   ? 'flat'
               : 'self-contain';
      if (!typeCounters[key]) typeCounters[key] = 0;
      const imgs = TYPE_IMAGES[key];
      const img  = imgs[typeCounters[key] % imgs.length];
      typeCounters[key]++;
      return img;
    }

    // ---- Check URL params ----
    const urlParams      = new URLSearchParams(window.location.search);
    const landlordIdParam = urlParams.get('landlord_id');
    const landlordName   = urlParams.get('landlord_name');

    // Pre-fill filters from URL
    if (urlParams.get('name'))      document.getElementById('filterName').value = urlParams.get('name');
    if (urlParams.get('room_type')) document.getElementById('filterType').value = urlParams.get('room_type');
    if (urlParams.get('max_rent'))  {
      document.getElementById('filterRent').value = urlParams.get('max_rent');
      document.getElementById('filterRentDisplay').textContent = '₦' + Number(urlParams.get('max_rent')).toLocaleString();
    }

    // If coming from a landlord profile — update page title
    if (landlordIdParam && landlordName) {
      document.getElementById('pageTitle').textContent    = `Properties by ${decodeURIComponent(landlordName)}`;
      document.getElementById('pageSubtitle').textContent = 'Showing all listings from this landlord';
      document.getElementById('backToLandlord').style.display = 'block';
    }

    // ---- Fallback Sample data ----
    const SAMPLE_DATA = [
      { id:1,  name:'Sunrise Lodge',    address:'Beside PAU Gate, Ibeju-Lekki',  rent:350000, room_type:'self-contain', distance_from_school:0.3, available:true,  landlord_id:1 },
      { id:2,  name:'Grace Apartment',  address:'Abraham Adesanya Estate, Ajah',  rent:280000, room_type:'shared',        distance_from_school:0.8, available:true,  landlord_id:2 },
      { id:3,  name:'Royal Chambers',   address:'Bogije, Ibeju-Lekki',            rent:480000, room_type:'flat',          distance_from_school:1.2, available:true,  landlord_id:1 },
      { id:4,  name:'Palm View Hostel', address:'Lakowe Estate',                   rent:220000, room_type:'single',       distance_from_school:2.0, available:true,  landlord_id:4 },
      { id:5,  name:'Lekki Gardens',    address:'Ibeju-Lekki Town',               rent:400000, room_type:'self-contain', distance_from_school:0.6, available:true,  landlord_id:3 },
      { id:6,  name:'Blue Crest Rooms',  address:'Ajah, Lagos',                    rent:310000, room_type:'shared',        distance_from_school:1.5, available:false, landlord_id:6 },
      { id:7,  name:'Harmony Court',    address:'Elerangbe, Ibeju-Lekki',         rent:450000, room_type:'flat',          distance_from_school:0.9, available:true,  landlord_id:5 },
      { id:8,  name:'Sunrise Court',    address:'Akodo, Ibeju-Lekki',             rent:260000, room_type:'single',       distance_from_school:1.8, available:true,  landlord_id:6 },
      { id:9,  name:'Victoria Suites',  address:'Ibeju-Lekki',                    rent:520000, room_type:'flat',          distance_from_school:0.5, available:true,  landlord_id:3 },
      { id:10, name:'Peace Haven',        address:'Bogije Road, Ibeju-Lekki',       rent:290000, room_type:'self-contain', distance_from_school:1.0, available:true,  landlord_id:2 },
      { id:11, name:'Green Valley Rooms', address:'Lakowe-Akodo Road',               rent:200000, room_type:'single',       distance_from_school:2.5, available:true,  landlord_id:4 },
      { id:12, name:'Ambassador Lodge',   address:'Beside PAU Road, Ibeju-Lekki',  rent:380000, room_type:'self-contain', distance_from_school:0.4, available:true,  landlord_id:5 },
    ];

    async function applyFilters() {
      const name    = document.getElementById('filterName').value;
      const type    = document.getElementById('filterType').value;
      const maxRent = document.getElementById('filterRent').value;
      const maxDist = document.getElementById('filterDist').value;
      const sortBy  = document.getElementById('sortBy').value;
      const grid    = document.getElementById('propertiesGrid');

      grid.innerHTML = '<p class="loading-text">Searching...</p>';
      Object.keys(typeCounters).forEach(k => typeCounters[k] = 0);

      let data;
      try {
        const qp = new URLSearchParams();
        if (name)    qp.append('name', name);
        if (type)    qp.append('room_type', type);
        if (maxRent) qp.append('max_rent', maxRent);
        if (landlordIdParam) qp.append('landlord_id', landlordIdParam); // Pass landlord filtering to API if present
        
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000); // 6s timeout to give Render's spin-up time a window
        
        const res = await fetch(`${BASE_URL}/api/properties?${qp}`, { signal: controller.signal });
        clearTimeout(timeout);
        data = await res.json();
      } catch (err) {
        console.warn("Backend unavailable, falling back to cached sample data:", err);
        data = [...SAMPLE_DATA];
      }

      // Client-side backup filter by landlord (in case endpoint handles it or falls back)
      if (landlordIdParam) {
        data = data.filter(p => String(p.landlord_id) === String(landlordIdParam));
      }

      // Client-side filters
      if (maxDist) data = data.filter(p => p.distance_from_school <= Number(maxDist));

      // Sort
      if (sortBy === 'price_asc')  data.sort((a,b) => a.rent - b.rent);
      if (sortBy === 'price_desc') data.sort((a,b) => b.rent - a.rent);
      if (sortBy === 'distance')   data.sort((a,b) => a.distance_from_school - b.distance_from_school);

      renderProperties(data);
    }

    function renderProperties(data) {
      const grid = document.getElementById('propertiesGrid');
      document.getElementById('resultsCount').textContent =
        `${data.length} propert${data.length === 1 ? 'y' : 'ies'} found`;

      if (!data.length) {
        grid.innerHTML = '<p class="loading-text">No properties match your filters.</p>';
        return;
      }

      grid.innerHTML = data.map(p => {
        const img = p.image_url
          ? `${BASE_URL}${p.image_url}`
          : getCardImage(p.room_type);
        return `
          <div class="property-card" onclick="window.location.href='property-detail.html?id=${p.id}'">
            <div class="property-img-wrap">
              <img src="${img}" alt="${p.name}"
                onerror="this.src='${getCardImage(p.room_type)}'"/>
              <span style="position:absolute;top:12px;left:12px;font-size:11px;font-weight:600;
                padding:3px 10px;border-radius:100px;
                background:${p.available===false?'#fee2e2':'#d1fae5'};
                color:${p.available===false?'#991b1b':'#065f46'};">
                ${p.available===false ? 'Unavailable' : 'Available'}
              </span>
              <button class="save-btn" title="Save"
                onclick="event.stopPropagation(); saveProperty(${JSON.stringify(p).replace(/"/g,'&quot;')})">&#9825;</button>
            </div>
            <div class="property-body">
              <span class="property-badge">${p.room_type}</span>
              <p class="property-name">${p.name}</p>
              <p class="property-meta">📍 ${p.address} &nbsp;|&nbsp; 🚶 ${p.distance_from_school}km from PAU</p>
              <div class="property-footer">
                <div class="property-price">&#8358;${Number(p.rent).toLocaleString()} <span>/yr</span></div>
                <a class="btn-details" href="property-detail.html?id=${p.id}">View Details</a>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function saveProperty(p) {
      const token = localStorage.getItem('pau_token');
      if (!token) { window.location.href = 'login.html'; return; }
      let saved = JSON.parse(localStorage.getItem('pau_saved') || '[]');
      if (saved.find(s => s.id === p.id)) { showToast('This property is already saved.', 'info'); return; }
      saved.push(p);
      localStorage.setItem('pau_saved', JSON.stringify(saved));
      showToast('Property saved to your dashboard.', 'success');
    }

    function clearFilters() {
      document.getElementById('filterName').value = '';
      document.getElementById('filterType').value = '';
      document.getElementById('filterRent').value = 1000000;
      document.getElementById('filterRentDisplay').textContent = '₦1,000,000';
      document.getElementById('filterDist').value = '';
      applyFilters();
    }

    initHamburger();
    applyFilters();
  </script>
</body>
</html>
